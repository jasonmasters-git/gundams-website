<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Gundam Collection</title>

  <style>

    /* =========================
       PAGE
       ========================= */

    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background: #f4f4f4;
      color: #222;
    }


    h1 {
      margin-top: 0;
      margin-bottom: 15px;
    }


    /* =========================
       CONTROLS
       ========================= */

    .controls {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }


    input,
    select {
      padding: 10px;
      font-size: 14px;
      border: 1px solid #ccc;
      border-radius: 6px;
      background: white;
    }


    #searchBox {
      width: 230px;
    }


    /* =========================
       STATISTICS
       ========================= */

    .stats {
      display: grid;
      grid-template-columns:
        repeat(auto-fit, minmax(160px, 1fr));

      gap: 15px;
      margin-bottom: 25px;
    }


    .stat {
      background: white;
      padding: 15px;
      border-radius: 10px;

      box-shadow:
        0 2px 8px rgba(0,0,0,0.10);

      text-align: center;
    }


    .stat-label {
      font-size: 14px;
      color: #666;
      margin-bottom: 8px;
    }


    .stat-value {
      font-size: 28px;
      font-weight: bold;
    }


    /* =========================
       INVENTORY GRID
       ========================= */

    .grid {
      display: grid;

      grid-template-columns:
        repeat(auto-fill, minmax(260px, 1fr));

      gap: 16px;
    }


    /* =========================
       MODEL CARD
       ========================= */

    .card {
      background: white;

      border-radius: 10px;

      padding: 16px;

      box-shadow:
        0 2px 8px rgba(0,0,0,0.10);

      overflow: hidden;
    }


    .unit {
      font-size: 19px;
      font-weight: bold;
      margin-bottom: 8px;
    }


    .meta {
      color: #555;
      margin: 5px 0;
    }


    /* =========================
       BUILT STATUS
       ========================= */

    .built {
      margin-top: 12px;
      font-weight: bold;
    }


    .built-yes {
      color: #16823b;
    }


    .built-no {
      color: #c62828;
    }


    /* =========================
       IMAGES
       ========================= */

    .mini-image {
      display: block;

      width: 100%;
      height: 260px;

      object-fit: cover;

      border-radius: 8px;

      margin-bottom: 12px;

      cursor: pointer;

      transition:
        transform 0.2s ease,
        opacity 0.2s ease;
    }


    .mini-image:hover {
      transform: scale(1.02);
      opacity: 0.9;
    }


    /* =========================
       NO IMAGE
       ========================= */

    .no-image {
      width: 100%;
      height: 260px;

      display: flex;

      align-items: center;
      justify-content: center;

      background: #eeeeee;

      border-radius: 8px;

      margin-bottom: 12px;

      color: #999;

      font-size: 14px;
    }


    /* =========================
       NO RESULTS
       ========================= */

    .no-results {
      grid-column: 1 / -1;

      text-align: center;

      padding: 40px;

      color: #777;

      background: white;

      border-radius: 10px;
    }


    /* =========================
       IMAGE MODAL
       ========================= */

    .modal {
      display: none;

      position: fixed;

      z-index: 1000;

      left: 0;
      top: 0;

      width: 100%;
      height: 100%;

      background: rgba(0,0,0,0.85);

      align-items: center;
      justify-content: center;

      padding: 20px;

      box-sizing: border-box;
    }


    .modal.show {
      display: flex;
    }


    .modal-image {
      max-width: 95%;
      max-height: 90vh;

      object-fit: contain;

      border-radius: 8px;
    }


    .close {
      position: absolute;

      top: 20px;
      right: 30px;

      color: white;

      font-size: 40px;

      font-weight: bold;

      cursor: pointer;

      line-height: 1;
    }


    .close:hover {
      color: #ccc;
    }


    /* =========================
       MOBILE
       ========================= */

    @media (max-width: 600px) {

      body {
        padding: 12px;
      }


      #searchBox {
        width: 100%;
        box-sizing: border-box;
      }


      .controls {
        flex-direction: column;
      }


      select {
        width: 100%;
      }


      .grid {
        grid-template-columns: 1fr;
      }

    }

  </style>

</head>


<body>


  <!-- =========================
       TITLE
       ========================= -->

  <h1>Gundam Collection</h1>


  <!-- =========================
       FILTERS
       ========================= -->

  <div class="controls">

    <input
      id="searchBox"
      type="text"
      placeholder="Search Gundams..."
    >


    <select id="franchiseFilter">

      <option value="">
        All Franchises
      </option>

    </select>


    <select id="scaleFilter">

      <option value="">
        All Scales
      </option>

    </select>


    <select id="builtFilter">

      <option value="">
        All Models
      </option>

      <option value="yes">
        Built
      </option>

      <option value="no">
        Unbuilt
      </option>

    </select>

  </div>


  <!-- =========================
       STATISTICS
       ========================= -->

  <div class="stats">

    <div class="stat">

      <div class="stat-label">
        Total Kits
      </div>

      <div
        id="totalKits"
        class="stat-value"
      >
        0
      </div>

    </div>


    <div class="stat">

      <div class="stat-label">
        Built
      </div>

      <div
        id="builtKits"
        class="stat-value"
      >
        0
      </div>

    </div>


    <div class="stat">

      <div class="stat-label">
        Unbuilt
      </div>

      <div
        id="unbuiltKits"
        class="stat-value"
      >
        0
      </div>

    </div>


    <div class="stat">

      <div class="stat-label">
        Build %
      </div>

      <div
        id="buildPercent"
        class="stat-value"
      >
        0%
      </div>

    </div>

  </div>


  <!-- =========================
       INVENTORY
       ========================= -->

  <div
    id="inventory"
    class="grid"
  ></div>


  <!-- =========================
       IMAGE MODAL
       ========================= -->

  <div
    id="imageModal"
    class="modal"
  >

    <span
      id="closeModal"
      class="close"
    >
      &times;
    </span>


    <img
      id="modalImage"
      class="modal-image"
      src=""
      alt="Full size Gundam"
    >

  </div>


  <script>


    /* =========================================================
       GOOGLE SHEET
       ========================================================= */

    const csvUrl =
      "https://docs.google.com/spreadsheets/d/e/2PACX-1vQp4lE0UwI-5wQSvnH09swpvvmm_lPQ4g34hb717wIRx_r9zEncqzzHt8jwyQIoJIoAzI0OUWjaigN3/pub?gid=0&single=true&output=csv";


    let inventory = [];


    /* =========================================================
       CSV PARSER
       
       This handles commas inside quoted spreadsheet cells.
       ========================================================= */

    function parseCSV(text) {

      const rows = [];

      let row = [];

      let cell = "";

      let insideQuotes = false;


      for (let i = 0; i < text.length; i++) {

        const character = text[i];

        const nextCharacter =
          text[i + 1];


        /* Handle escaped quotes */

        if (
          character === '"' &&
          insideQuotes &&
          nextCharacter === '"'
        ) {

          cell += '"';

          i++;

          continue;

        }


        /* Start/end quotes */

        if (character === '"') {

          insideQuotes =
            !insideQuotes;

          continue;

        }


        /* Comma = next cell */

        if (
          character === "," &&
          !insideQuotes
        ) {

          row.push(cell);

          cell = "";

          continue;

        }


        /* New line = next row */

        if (
          (character === "\n" ||
           character === "\r") &&
          !insideQuotes
        ) {

          if (
            character === "\r" &&
            nextCharacter === "\n"
          ) {

            i++;

          }


          row.push(cell);

          rows.push(row);


          row = [];

          cell = "";

          continue;

        }


        cell += character;

      }


      /* Add final cell */

      if (cell !== "" || row.length > 0) {

        row.push(cell);

        rows.push(row);

      }


      return rows;

    }


    /* =========================================================
       CONVERT GOOGLE DRIVE LINKS
       ========================================================= */

    function convertImageUrl(url) {

      if (!url) {
        return "";
      }


      url = url.trim();


      /*
       * Already using lh3.googleusercontent.com
       */

      if (
        url.includes(
          "lh3.googleusercontent.com"
        )
      ) {

        return url;

      }


      /*
       * Google Drive:
       *
       * https://drive.google.com/file/d/FILE_ID/view
       */

      const driveMatch =
        url.match(
          /drive\.google\.com\/file\/d\/([^\/]+)/
        );


      if (driveMatch) {

        const fileId =
          driveMatch[1];


        return (
          "https://lh3.googleusercontent.com/d/" +
          fileId
        );

      }


      /*
       * Google Drive:
       *
       * https://drive.google.com/uc?id=FILE_ID
       */

      const ucMatch =
        url.match(
          /drive\.google\.com\/.*[?&]id=([^&]+)/
        );


      if (ucMatch) {

        const fileId =
          ucMatch[1];


        return (
          "https://lh3.googleusercontent.com/d/" +
          fileId
        );

      }


      /*
       * If it isn't a Google Drive URL,
       * use the URL as-is.
       */

      return url;

    }


    /* =========================================================
       LOAD GOOGLE SHEET
       ========================================================= */

    async function loadInventory() {

      try {

        const response =
          await fetch(csvUrl);


        if (!response.ok) {

          throw new Error(
            "Unable to load Google Sheet"
          );

        }


        const text =
          await response.text();


        const rows =
          parseCSV(text);


        /*
         * Remove header row
         */

        rows.shift();


        /*
         * Convert spreadsheet columns
         *
         * A = Franchise
         * B = Scale
         * C = Name
         * D = Built
         * E = Image
         */

        inventory = rows

          .map(row => {

            return {

              Franchise:
                row[0]
                  ? row[0].trim()
                  : "",

              Scale:
                row[1]
                  ? row[1].trim()
                  : "",

              Name:
                row[2]
                  ? row[2].trim()
                  : "",

              Built:
                row[3]
                  ? row[3].trim()
                  : "",

              Image:
                row[4]
                  ? row[4].trim()
                  : ""

            };

          })


          /*
           * Ignore completely blank rows
           */

          .filter(item =>
            item.Name !== ""
          );


        populateFilters();

        renderInventory();

      }


      catch (error) {

        console.error(
          "Error loading Gundam inventory:",
          error
        );


        document.getElementById(
          "inventory"
        ).innerHTML = `

          <div class="no-results">

            Unable to load the Gundam inventory.

            <br><br>

            Check that the Google Sheet
            is published to the web.

          </div>

        `;

      }

    }


    /* =========================================================
       POPULATE FILTER DROPDOWNS
       ========================================================= */

    function populateFilters() {

      const franchiseFilter =
        document.getElementById(
          "franchiseFilter"
        );


      const scaleFilter =
        document.getElementById(
          "scaleFilter"
        );


      /*
       * Reset filters
       */

      franchiseFilter.innerHTML =
        '<option value="">All Franchises</option>';


      scaleFilter.innerHTML =
        '<option value="">All Scales</option>';


      /*
       * Get unique franchises
       */

      const franchises = [
        ...new Set(

          inventory

            .map(item =>
              item.Franchise
            )

            .filter(value =>
              value !== ""
            )

        )
      ].sort();


      /*
       * Get unique scales
       */

      const scales = [
        ...new Set(

          inventory

            .map(item =>
              item.Scale
            )

            .filter(value =>
              value !== ""
            )

        )
      ].sort();


      /*
       * Add franchise options
       */

      franchises.forEach(
        franchise => {

          const option =
            document.createElement(
              "option"
            );


          option.value =
            franchise;


          option.textContent =
            franchise;


          franchiseFilter.appendChild(
            option
          );

        }
      );


      /*
       * Add scale options
       */

      scales.forEach(
        scale => {

          const option =
            document.createElement(
              "option"
            );


          option.value =
            scale;


          option.textContent =
            scale;


          scaleFilter.appendChild(
            option
          );

        }
      );

    }


    /* =========================================================
       UPDATE STATISTICS
       ========================================================= */

    function updateStats(items) {

      const total =
        items.length;


      const built =
        items.filter(
          item =>
            item.Built.toLowerCase() ===
            "yes"
        ).length;


      const unbuilt =
        total - built;


      const percentage =
        total > 0
          ? Math.round(
              (built / total) * 100
            )
          : 0;


      document.getElementById(
        "totalKits"
      ).textContent = total;


      document.getElementById(
        "builtKits"
      ).textContent = built;


      document.getElementById(
        "unbuiltKits"
      ).textContent = unbuilt;


      document.getElementById(
        "buildPercent"
      ).textContent =
        percentage + "%";

    }


    /* =========================================================
       RENDER INVENTORY
       ========================================================= */

    function renderInventory() {

      const search =
        document
          .getElementById(
            "searchBox"
          )
          .value
          .toLowerCase()
          .trim();


      const franchise =
        document
          .getElementById(
            "franchiseFilter"
          )
          .value;


      const scale =
        document
          .getElementById(
            "scaleFilter"
          )
          .value;


      const builtFilter =
        document
          .getElementById(
            "builtFilter"
          )
          .value;


      /*
       * Filter inventory
       */

      const filtered =
        inventory.filter(item => {

          const matchesSearch =

            !search ||

            item.Name
              .toLowerCase()
              .includes(search);


          const matchesFranchise =

            !franchise ||

            item.Franchise ===
            franchise;


          const matchesScale =

            !scale ||

            item.Scale ===
            scale;


          const builtValue =
            item.Built
              .toLowerCase();


          const matchesBuilt =

            !builtFilter ||

            (
              builtFilter === "yes" &&
              builtValue === "yes"
            ) ||

            (
              builtFilter === "no" &&
              builtValue !== "yes"
            );


          return (

            matchesSearch &&
            matchesFranchise &&
            matchesScale &&
            matchesBuilt

          );

        });


      /*
       * Update statistics
       */

      updateStats(filtered);


      /*
       * Display cards
       */

      const container =
        document.getElementById(
          "inventory"
        );


      container.innerHTML = "";


      /*
       * No results
       */

      if (filtered.length === 0) {

        container.innerHTML = `

          <div class="no-results">

            No Gundams match your filters.

          </div>

        `;

        return;

      }


      /*
       * Create cards
       */

      filtered.forEach(item => {

        const card =
          document.createElement(
            "div"
          );


        card.className =
          "card";


        /*
         * Convert image URL
         */

        const imageUrl =
          convertImageUrl(
            item.Image
          );


        /*
         * Image HTML
         */

        let imageHTML = "";


        if (imageUrl) {

          imageHTML = `

            <img

              class="mini-image"

              src="${imageUrl}"

              alt="${escapeHTML(
                item.Name
              )}"

              data-full-image="${imageUrl}"

              onerror="this.style.display='none'"

            >

          `;

        }

        else {

          imageHTML = `

            <div class="no-image">

              No Image

            </div>

          `;

        }


        /*
         * Built status
         */

        const isBuilt =
          item.Built
            .toLowerCase() ===
          "yes";


        const builtHTML = isBuilt

          ? `

              <div class="built built-yes">

                Built

              </div>

            `

          : `

              <div class="built built-no">

                Unbuilt

              </div>

            `;


        /*
         * Build card
         */

        card.innerHTML = `

          ${imageHTML}


          <div class="unit">

            ${escapeHTML(
              item.Name
            )}

          </div>


          <div class="meta">

            Franchise:
            ${escapeHTML(
              item.Franchise ||
              "Unknown"
            )}

          </div>


          <div class="meta">

            Scale:
            ${escapeHTML(
              item.Scale ||
              "Unknown"
            )}

          </div>


          ${builtHTML}

        `;


        /*
         * Make image clickable
         */

        const image =
          card.querySelector(
            ".mini-image"
          );


        if (image) {

          image.addEventListener(
            "click",
            function() {

              openImage(
                this.dataset.fullImage,
                item.Name
              );

            }
          );

        }


        container.appendChild(
          card
        );

      });

    }


    /* =========================================================
       ESCAPE HTML
       ========================================================= */

    function escapeHTML(value) {

      return String(value)

        .replace(
          /&/g,
          "&amp;"
        )

        .replace(
          /</g,
          "&lt;"
        )

        .replace(
          />/g,
          "&gt;"
        )

        .replace(
          /"/g,
          "&quot;"
        )

        .replace(
          /'/g,
          "&#039;"
        );

    }


    /* =========================================================
       OPEN FULL SIZE IMAGE
       ========================================================= */

    function openImage(
      imageUrl,
      name
    ) {

      const modal =
        document.getElementById(
          "imageModal"
        );


      const modalImage =
        document.getElementById(
          "modalImage"
        );


      modalImage.src =
        imageUrl;


      modalImage.alt =
        name;


      modal.classList.add(
        "show"
      );

    }


    /* =========================================================
       CLOSE IMAGE MODAL
       ========================================================= */

    function closeImage() {

      const modal =
        document.getElementById(
          "imageModal"
        );


      const modalImage =
        document.getElementById(
          "modalImage"
        );


      modal.classList.remove(
        "show"
      );


      modalImage.src =
        "";

    }


    /* =========================================================
       EVENT LISTENERS
       ========================================================= */

    document
      .getElementById(
        "searchBox"
      )
      .addEventListener(
        "input",
        renderInventory
      );


    document
      .getElementById(
        "franchiseFilter"
      )
      .addEventListener(
        "change",
        renderInventory
      );


    document
      .getElementById(
        "scaleFilter"
      )
      .addEventListener(
        "change",
        renderInventory
      );


    document
      .getElementById(
        "builtFilter"
      )
      .addEventListener(
        "change",
        renderInventory
      );


    document
      .getElementById(
        "closeModal"
      )
      .addEventListener(
        "click",
        closeImage
      );


    /*
     * Clicking outside the image
     * also closes the modal.
     */

    document
      .getElementById(
        "imageModal"
      )
      .addEventListener(
        "click",
        function(event) {

          if (
            event.target === this
          ) {

            closeImage();

          }

        }
      );


    /*
     * ESC key closes the image
     */

    document.addEventListener(
      "keydown",
      function(event) {

        if (
          event.key === "Escape"
        ) {

          closeImage();

        }

      }
    );


    /* =========================================================
       START
       ========================================================= */

    loadInventory();


  </script>


</body>

</html>
