<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Gundam Collection</title>

  <style>

    /* =========================
       PAGE
       ========================= */

    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background: #f5f5f5;
      color: #111;
    }

    .container {
      padding: 20px;
    }

    h1 {
      margin-top: 0;
      margin-bottom: 15px;
    }


    /* =========================
       FILTERS
       ========================= */

    .controls {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    input,
    select {
      padding: 10px;
      font-size: 14px;
      border: 1px solid #ccc;
      border-radius: 6px;
      background: white;
    }

    #searchBox {
      width: 230px;
    }


    /* =========================
       STATISTICS
       ========================= */

    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 15px;
      margin-bottom: 25px;
    }

    .stat {
      background: white;
      border-radius: 10px;
      padding: 15px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.10);
    }

    .stat-label {
      font-size: 14px;
      color: #555;
      margin-bottom: 8px;
    }

    .stat-value {
      font-size: 28px;
      font-weight: bold;
    }


    /* =========================
       GUNDAM GRID
       ========================= */

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
    }


    /* =========================
       GUNDAM CARD
       ========================= */

    .card {
      background: white;
      border-radius: 10px;
      padding: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.12);
      overflow: hidden;
    }

    .unit {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .meta {
      color: #555;
      margin: 5px 0;
      font-size: 14px;
    }


    /* =========================
       DESCRIPTION
       ========================= */

    .description {
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid #eee;

      font-size: 14px;
      line-height: 1.5;
      color: #555;
    }


    /* =========================
       BUILD STATUS
       ========================= */

    .built {
      margin-top: 12px;
      font-weight: bold;
      color: #087a2a;
    }

    .unbuilt {
      margin-top: 12px;
      font-weight: bold;
      color: #d00000;
    }


    /* =========================
       IMAGES
       ========================= */

    .mini-image {
      width: 100%;
      height: 250px;

      object-fit: cover;

      border-radius: 8px;

      margin-bottom: 12px;

      cursor: pointer;

      transition: transform 0.2s ease;
    }

    .mini-image:hover {
      transform: scale(1.02);
    }

    .no-image {
      width: 100%;
      height: 250px;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #eee;

      color: #999;

      border-radius: 8px;

      margin-bottom: 12px;
    }


    /* =========================
       IMAGE MODAL
       ========================= */

    .modal {
      display: none;

      position: fixed;

      z-index: 1000;

      left: 0;
      top: 0;

      width: 100%;
      height: 100%;

      background: rgba(0,0,0,0.85);

      align-items: center;
      justify-content: center;

      padding: 20px;

      box-sizing: border-box;
    }

    .modal img {
      max-width: 95%;
      max-height: 95%;

      object-fit: contain;

      border-radius: 8px;
    }

    .close {
      position: absolute;

      top: 20px;
      right: 30px;

      color: white;

      font-size: 40px;

      cursor: pointer;

      font-weight: bold;
    }


    /* =========================
       RESPONSIVE
       ========================= */

    @media (max-width: 800px) {

      .stats {
        grid-template-columns: repeat(2, 1fr);
      }

    }

    @media (max-width: 500px) {

      .stats {
        grid-template-columns: 1fr;
      }

      #searchBox {
        width: 100%;
      }

      .controls {
        flex-direction: column;
      }

      select {
        width: 100%;
      }

    }

  </style>
</head>


<body>

<div class="container">

  <h1>Gundam Collection</h1>


  <!-- =========================
       FILTERS
       ========================= -->

  <div class="controls">

    <input
      id="searchBox"
      type="text"
      placeholder="Search Gundams..."
    >

    <select id="franchiseFilter">
      <option value="">All Franchises</option>
    </select>

    <select id="scaleFilter">
      <option value="">All Scales</option>
    </select>

    <select id="builtFilter">
      <option value="">All Models</option>
      <option value="Yes">Built</option>
      <option value="No">Unbuilt</option>
    </select>

  </div>


  <!-- =========================
       STATISTICS
       ========================= -->

  <div class="stats">

    <div class="stat">

      <div class="stat-label">
        Total Kits
      </div>

      <div
        id="totalKits"
        class="stat-value"
      >
        0
      </div>

    </div>


    <div class="stat">

      <div class="stat-label">
        Built
      </div>

      <div
        id="totalBuilt"
        class="stat-value"
      >
        0
      </div>

    </div>


    <div class="stat">

      <div class="stat-label">
        Unbuilt
      </div>

      <div
        id="totalUnbuilt"
        class="stat-value"
      >
        0
      </div>

    </div>


    <div class="stat">

      <div class="stat-label">
        Build %
      </div>

      <div
        id="buildPercentage"
        class="stat-value"
      >
        0%
      </div>

    </div>

  </div>


  <!-- =========================
       INVENTORY
       ========================= -->

  <div
    id="inventory"
    class="grid"
  ></div>

</div>


<!-- =========================
     IMAGE MODAL
     ========================= -->

<div
  id="imageModal"
  class="modal"
>

  <span
    id="closeModal"
    class="close"
  >
    &times;
  </span>

  <img
    id="modalImage"
    src=""
    alt="Full size Gundam"
  >

</div>


<script>

  /* =========================
     GOOGLE SHEETS
     ========================= */

  const csvUrl =
    "https://docs.google.com/spreadsheets/d/e/2PACX-1vQp4lE0UwI-5wQSvnH09swpvvmm_lPQ4g34hb717wIRx_r9zEncqzzHt8jwyQIoJIoAzI0OUWjaigN3/pub?gid=0&single=true&output=csv";


  let inventory = [];


  /* =========================
     LOAD SPREADSHEET
     ========================= */

  async function loadInventory() {

    try {

      const response = await fetch(csvUrl);

      if (!response.ok) {
        throw new Error("Could not load Google Sheet");
      }

      const text = await response.text();


      /*
       * Parse CSV correctly.
       * This is important because descriptions
       * can contain commas.
       */

      const rows = parseCSV(text);


      const headers = rows.shift();


      inventory = rows.map(row => {

        let item = {};

        headers.forEach((header, index) => {

          item[header.trim()] =
            row[index] ? row[index].trim() : "";

        });

        return item;

      });


      populateFilters();

      renderInventory();

    }

    catch (error) {

      console.error(error);

      document.getElementById("inventory").innerHTML = `
        <p>
          Unable to load the Gundam collection.
        </p>
      `;

    }

  }


  /* =========================
     CSV PARSER
     ========================= */

  function parseCSV(text) {

    const rows = [];

    let row = [];

    let cell = "";

    let insideQuotes = false;


    for (let i = 0; i < text.length; i++) {

      const char = text[i];

      const next = text[i + 1];


      if (char === '"' && insideQuotes && next === '"') {

        cell += '"';

        i++;

      }

      else if (char === '"') {

        insideQuotes = !insideQuotes;

      }

      else if (char === ',' && !insideQuotes) {

        row.push(cell);

        cell = "";

      }

      else if (
        (char === '\n' || char === '\r') &&
        !insideQuotes
      ) {

        if (char === '\r' && next === '\n') {
          i++;
        }

        row.push(cell);

        rows.push(row);

        row = [];

        cell = "";

      }

      else {

        cell += char;

      }

    }


    if (cell !== "" || row.length > 0) {

      row.push(cell);

      rows.push(row);

    }


    return rows;

  }


  /* =========================
     FILTER DROPDOWNS
     ========================= */

  function populateFilters() {

    const franchiseFilter =
      document.getElementById("franchiseFilter");

    const scaleFilter =
      document.getElementById("scaleFilter");


    const franchises = [
      ...new Set(
        inventory
          .map(item => item.Franchise)
          .filter(Boolean)
      )
    ].sort();


    const scales = [
      ...new Set(
        inventory
          .map(item => item.Scale)
          .filter(Boolean)
      )
    ].sort();


    franchises.forEach(franchise => {

      const option =
        document.createElement("option");

      option.value = franchise;

      option.textContent = franchise;

      franchiseFilter.appendChild(option);

    });


    scales.forEach(scale => {

      const option =
        document.createElement("option");

      option.value = scale;

      option.textContent = scale;

      scaleFilter.appendChild(option);

    });

  }


  /* =========================
     FILTER INVENTORY
     ========================= */

  function getFilteredInventory() {

    const search =
      document
        .getElementById("searchBox")
        .value
        .toLowerCase();


    const franchise =
      document
        .getElementById("franchiseFilter")
        .value;


    const scale =
      document
        .getElementById("scaleFilter")
        .value;


    const built =
      document
        .getElementById("builtFilter")
        .value;


    return inventory.filter(item => {

      const matchesSearch =
        !search ||
        (item.Name || "")
          .toLowerCase()
          .includes(search);


      const matchesFranchise =
        !franchise ||
        item.Franchise === franchise;


      const matchesScale =
        !scale ||
        item.Scale === scale;


      const matchesBuilt =
        !built ||
        item.Built === built;


      return (
        matchesSearch &&
        matchesFranchise &&
        matchesScale &&
        matchesBuilt
      );

    });

  }


  /* =========================
     UPDATE STATISTICS
     ========================= */

  function updateStats(items) {

    const totalKits = items.length;


    const totalBuilt =
      items.filter(
        item => item.Built === "Yes"
      ).length;


    const totalUnbuilt =
      totalKits - totalBuilt;


    const buildPercentage =
      totalKits > 0
        ? Math.round(
            (totalBuilt / totalKits) * 100
          )
        : 0;


    document.getElementById("totalKits")
      .textContent = totalKits;


    document.getElementById("totalBuilt")
      .textContent = totalBuilt;


    document.getElementById("totalUnbuilt")
      .textContent = totalUnbuilt;


    document.getElementById("buildPercentage")
      .textContent = buildPercentage + "%";

  }


  /* =========================
     DISPLAY INVENTORY
     ========================= */

  function renderInventory() {

    const filtered =
      getFilteredInventory();


    updateStats(filtered);


    const container =
      document.getElementById("inventory");


    container.innerHTML = "";


    if (filtered.length === 0) {

      container.innerHTML = `
        <p>
          No Gundams match your filters.
        </p>
      `;

      return;

    }


    filtered.forEach(item => {

      const card =
        document.createElement("div");

      card.className = "card";


      /*
       * IMAGE
       */

      let imageHTML = "";

      if (item.Image) {

        imageHTML = `
          <img
            class="mini-image"
            src="${item.Image}"
            alt="${item.Name || "Gundam"}"
            onclick="openImage('${item.Image.replace(/'/g, "\\'")}')"
            onerror="this.parentElement.querySelector('.no-image').style.display='flex'; this.style.display='none';"
          >

          <div
            class="no-image"
            style="display:none;"
          >
            No Image
          </div>
        `;

      }

      else {

        imageHTML = `
          <div class="no-image">
            No Image
          </div>
        `;

      }


      /*
       * DESCRIPTION
       */

      const descriptionHTML =
        item.Description
          ? `
            <div class="description">
              ${item.Description}
            </div>
          `
          : "";


      /*
       * BUILD STATUS
       */

      const buildStatus =
        item.Built === "Yes"
          ? `
            <div class="built">
              Built
            </div>
          `
          : `
            <div class="unbuilt">
              Unbuilt
            </div>
          `;


      /*
       * BUILD CARD
       */

      card.innerHTML = `

        ${imageHTML}

        <div class="unit">
          ${item.Name || "Unnamed Model"}
        </div>

        <div class="meta">
          Franchise:
          ${item.Franchise || "Unknown"}
        </div>

        <div class="meta">
          Scale:
          ${item.Scale || "Unknown"}
        </div>

        ${descriptionHTML}

        ${buildStatus}

      `;


      container.appendChild(card);

    });

  }


  /* =========================
     IMAGE MODAL
     ========================= */

  function openImage(imageURL) {

    const modal =
      document.getElementById("imageModal");

    const modalImage =
      document.getElementById("modalImage");


    modalImage.src = imageURL;

    modal.style.display = "flex";

  }


  function closeImage() {

    document.getElementById("imageModal")
      .style.display = "none";

  }


  document
    .getElementById("closeModal")
    .addEventListener(
      "click",
      closeImage
    );


  document
    .getElementById("imageModal")
    .addEventListener(
      "click",
      function(event) {

        if (
          event.target === this
        ) {
          closeImage();
        }

      }
    );


  /* =========================
     FILTER EVENTS
     ========================= */

  document
    .getElementById("searchBox")
    .addEventListener(
      "input",
      renderInventory
    );


  document
    .getElementById("franchiseFilter")
    .addEventListener(
      "change",
      renderInventory
    );


  document
    .getElementById("scaleFilter")
    .addEventListener(
      "change",
      renderInventory
    );


  document
    .getElementById("builtFilter")
    .addEventListener(
      "change",
      renderInventory
    );


  /* =========================
     START
     ========================= */

  loadInventory();

</script>

</body>
</html>
